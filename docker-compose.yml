services:
    app:
        container_name: anime_wiki_api
        build:
            context: ./
            dockerfile: ./Dockerfile
        ports:
            - ${PORT}:8000
        depends_on:
            postgresql:
                condition: service_healthy
        volumes:
            - .:/api
            - /api/node_modules
        env_file:
            - .env

    postgresql:
        image: postgres
        container_name: anime_wiki_db
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: anime_wiki
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U root']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
